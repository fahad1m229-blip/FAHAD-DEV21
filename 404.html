<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>404 — FAHAD DEV</title>
  <script>
    (function () {
      var path = window.location.pathname;
      var marker = "/FAHAD/admin";
      var idx = path.indexOf(marker);
      if (idx !== -1) {
        var sub = path.slice(idx + marker.length).replace(/^\/+|\/+$/g, "");
        if (sub) {
          try { sessionStorage.setItem("fahad_pending_admin_route", sub); } catch (e) {}
        }
        var target = path.slice(0, idx) + "/FAHAD/admin/";
        window.location.replace(target + window.location.search + window.location.hash);
      }
    })();
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #05070F;
      color: #EAF0FF;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 24px;
    }
    .box {
      max-width: 440px;
      width: 100%;
      padding: 32px;
      border-radius: 20px;
      background: rgba(15, 24, 52, 0.7);
      border: 1px solid rgba(108, 140, 255, 0.25);
      text-align: center;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0 22px;
      border-radius: 12px;
      background: linear-gradient(135deg, #3B6CFF, #8B5CF6);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <main class="box">
    <h1>404 — Page Not Found</h1>
    <p style="color:#8A97B8;">The requested page could not be found.</p>
    <a href="./index.html">Return to FAHAD DEV</a>
  </main>
</body>
</html>
