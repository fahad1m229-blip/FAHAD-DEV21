<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>FAHAD DEV — Admin Gateway</title>

  <!-- Dynamic base resolution so refreshes on /FAHAD/admin/* work on root domains & GitHub Pages subpaths -->
  <script>
    (function () {
      var p = window.location.pathname;
      var i = p.indexOf('/FAHAD/admin');
      var root = i !== -1 ? p.slice(0, i) + '/' : '/';
      var base = document.createElement('base');
      base.href = root + 'FAHAD/admin/';
      document.head.appendChild(base);
    })();
  </script>

  <link rel="icon" type="image/png" href="../../assets/img/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Orbitron:wght@700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="../../assets/css/admin.css" />
</head>
<body>
  <canvas id="admin-three-canvas" aria-hidden="true"></canvas>
  <div class="admin-grid-bg" aria-hidden="true"></div>

  <!-- ======================================================================
       HIDDEN ADMIN LOGIN SCREEN (/FAHAD/admin)
       ====================================================================== -->
  <section id="admin-login-screen" class="auth-screen">
    <div class="glass-card auth-card">
      <div class="auth-brand">
        <img src="../../assets/img/logo.svg" alt="FAHAD DEV Logo" />
        <div>
          <h1 data-i18n="loginTitle">FAHAD DEV ADMIN</h1>
          <p class="auth-sub" data-i18n="loginSubtitle">Restricted Gateway • Authenticate to access protected admin routes.</p>
        </div>
      </div>

      <div id="login-alert" class="auth-alert" role="alert" hidden></div>

      <form id="admin-login-form" style="display:flex;flex-direction:column;gap:14px;">
        <div class="field">
          <label for="login-email" data-i18n="emailLabel">Admin Username or Email</label>
          <input id="login-email" type="text" required autocomplete="username" placeholder="admin@yourdomain.com" />
        </div>

        <div class="field">
          <label for="login-password" data-i18n="passwordLabel">Admin Password</label>
          <div class="input-with-action">
            <input id="login-password" type="password" required autocomplete="current-password" placeholder="••••••••" />
            <button id="toggle-password-btn" class="input-eye-btn" type="button" aria-label="Show or hide password">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="auth-row">
          <label class="checkbox-label">
            <input id="login-remember" type="checkbox" checked />
            <span data-i18n="rememberMe">Remember me</span>
          </label>
          <button id="forgot-password-btn" class="link-btn" type="button" data-i18n="forgotPassword">Forgot password?</button>
        </div>

        <button id="login-submit-btn" class="btn btn-primary" type="submit" data-i18n="signInBtn">
          Authenticate &amp; Enter
        </button>
      </form>

      <div class="auth-row" style="border-top:1px solid var(--border);padding-top:12px;">
        <a href="../../index.html" class="link-btn js-view-website">← <span data-i18n="viewWebsite">View User Panel</span></a>
        <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);">Protected Gateway</span>
      </div>
    </div>
  </section>

  <!-- ======================================================================
       PROTECTED ADMIN DASHBOARD SHELL
       ====================================================================== -->
  <div id="admin-app-shell" class="admin-shell" hidden>
    <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

    <aside id="admin-sidebar" class="admin-sidebar" aria-label="Admin Navigation">
      <div class="sidebar-head">
        <a href="../../index.html" target="_blank" rel="noopener noreferrer" class="brand-inline js-view-website">
          <img src="../../assets/img/logo.svg" alt="FAHAD DEV" />
          <span class="brand-title">FAHAD DEV</span>
        </a>
        <span id="sidebar-role-badge" class="role-pill">owner</span>
      </div>
      <nav id="admin-sidebar-nav" class="sidebar-nav"></nav>
    </aside>

    <div class="admin-main-col">
      <header class="admin-topbar">
        <div class="topbar-left">
          <button id="mobile-menu-btn" class="icon-btn mobile-menu-btn" type="button" aria-label="Open sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          </button>
          <h1 id="admin-page-title" class="page-heading">Overview</h1>
        </div>

        <div class="topbar-right">
          <button id="admin-notify-btn" class="icon-btn" type="button" aria-label="Activity Overview">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          </button>

          <button id="admin-theme-btn" class="icon-btn" type="button" aria-label="Toggle theme">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          </button>

          <button id="admin-lang-btn" class="icon-btn" type="button" aria-label="Switch language">
            <span id="admin-lang-label">বাং</span>
          </button>

          <div class="dropdown-wrap">
            <button id="threedot-menu-btn" class="icon-btn" type="button" aria-label="More actions">
              <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
            </button>
            <div id="threedot-dropdown-menu" class="dropdown-menu" hidden>
              <a class="dropdown-item js-view-website" href="../../index.html" target="_blank" rel="noopener noreferrer" data-i18n="viewWebsite">View User Panel</a>
              <button id="td-refresh-btn" class="dropdown-item" type="button" data-i18n="refreshData">Refresh Data</button>
              <button id="td-clear-cache-btn" class="dropdown-item" type="button" data-i18n="clearCache">Clear Cache</button>
              <button id="td-maintenance-btn" class="dropdown-item" type="button" data-i18n="maintenanceMode">Maintenance Mode</button>
              <button id="td-help-btn" class="dropdown-item" type="button" data-i18n="help">Security Info</button>
              <button id="td-logout-btn" class="dropdown-item danger" type="button" data-i18n="logout">Logout</button>
            </div>
          </div>

          <div class="dropdown-wrap">
            <button id="profile-dropdown-btn" class="avatar-btn" type="button" aria-label="Admin profile menu">
              <span id="header-avatar-slot"></span>
            </button>
            <div id="profile-dropdown-menu" class="dropdown-menu" hidden>
              <div class="dropdown-header">
                <strong id="profile-drop-name">Admin</strong>
                <span id="profile-drop-email">admin@example.com</span>
                <span id="profile-drop-role" style="color:var(--cyan);font-size:11px;display:block;margin-top:4px;">Role: OWNER</span>
              </div>
              <button id="profile-open-btn" class="dropdown-item" type="button" data-i18n="adminProfile">Admin Profile</button>
              <div style="padding:6px 10px;">
                <label for="inactivity-timeout-select" style="font-size:11.5px;color:var(--muted);display:block;margin-bottom:4px;">Auto Logout</label>
                <select id="inactivity-timeout-select" style="width:100%;padding:6px;border-radius:8px;background:var(--bg);color:var(--text);border:1px solid var(--border);">
                  <option value="15">15 min</option>
                  <option value="30" selected>30 min</option>
                  <option value="60">60 min</option>
                </select>
              </div>
              <button id="profile-logout-btn" class="dropdown-item danger" type="button" data-i18n="logout">Logout</button>
            </div>
          </div>
        </div>
      </header>

      <main id="admin-view-container" class="admin-content"></main>
    </div>

    <nav class="mobile-bottom-nav" aria-label="Mobile Quick Navigation">
      <button type="button" class="bottom-nav-btn active" data-section="overview">
        <span>Overview</span>
      </button>
      <button type="button" class="bottom-nav-btn" data-section="users">
        <span>Users</span>
      </button>
      <button type="button" class="bottom-nav-btn" data-section="content">
        <span>Content</span>
      </button>
      <button type="button" class="bottom-nav-btn" data-section="settings">
        <span>Settings</span>
      </button>
      <button type="button" class="bottom-nav-btn" data-section="profile">
        <span>Profile</span>
      </button>
    </nav>
  </div>

  <div id="admin-confirm-modal" class="modal-backdrop" role="dialog" aria-modal="true" hidden>
    <div class="glass-card modal-card">
      <h2 id="confirm-modal-title" style="margin:0;font-family:'Orbitron',sans-serif;font-size:18px;">Confirm</h2>
      <p id="confirm-modal-msg" style="margin:0;color:var(--muted);font-size:14px;"></p>
      <div style="display:flex;justify-content:flex-end;gap:10px;">
        <button id="confirm-modal-cancel" class="btn btn-glass btn-sm" type="button">Cancel</button>
        <button id="confirm-modal-ok" class="btn btn-primary btn-sm" type="button">Confirm</button>
      </div>
    </div>
  </div>

  <div id="admin-toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="../../assets/js/admin.js"></script>
</body>
</html>
