<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#05070F" />
  <title>Offline — FAHAD DEV</title>
  <style>
    :root {
      --bg: #05070F;
      --bg-2: #0A1020;
      --card: rgba(15, 24, 52, 0.72);
      --primary: #3B6CFF;
      --primary-glow: #6C8CFF;
      --accent-violet: #8B5CF6;
      --accent-cyan: #22D3EE;
      --text: #EAF0FF;
      --muted: #8A97B8;
      --border: rgba(108, 140, 255, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(59, 108, 255, 0.2), transparent 45%),
        radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.18), transparent 45%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 24px;
    }
    .offline-card {
      max-width: 460px;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55), 0 0 40px rgba(59, 108, 255, 0.15);
    }
    .icon-ring {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, rgba(59, 108, 255, 0.25), rgba(34, 211, 238, 0.18));
      border: 1px solid rgba(34, 211, 238, 0.35);
      color: var(--accent-cyan);
    }
    .badge {
      display: inline-block;
      font-family: monospace;
      font-size: 12px;
      letter-spacing: 2px;
      color: var(--accent-cyan);
      margin-bottom: 10px;
    }
    h1 { font-size: 24px; margin-bottom: 10px; }
    p { color: var(--muted); line-height: 1.6; font-size: 15px; margin-bottom: 24px; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 0 26px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, var(--primary), var(--accent-violet));
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 10px 25px rgba(59, 108, 255, 0.35);
    }
    .btn:focus-visible { outline: 2px solid var(--accent-cyan); outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="offline-card">
    <div class="icon-ring" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="2" y1="2" x2="22" y2="22"></line>
        <path d="M8.5 16.5a5 5 0 0 1 7 0"></path>
        <path d="M2 8.82a15 15 0 0 1 4.17-2.65"></path>
        <path d="M10.66 5c4.01-.36 8.14.9 11.34 3.76"></path>
        <path d="M16.85 11.25a10 10 0 0 1 2.22 1.68"></path>
        <path d="M5 13a10 10 0 0 1 5.24-2.76"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>
    <div class="badge">FAHAD DEV • OFFLINE MODE</div>
    <h1>You Are Currently Offline</h1>
    <p>No active internet connection was detected. Reconnect to sync real-time Firestore resources, versions, and tutorials.</p>
    <button class="btn" type="button" onclick="window.location.reload()">Try Reconnecting</button>
  </main>
</body>
</html>
